<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Parrot -->
  <g transform="translate(50, 20)">
    <!-- Body -->
    <path d="M 50,20 C 80,20 100,40 100,70 C 100,110 70,140 50,150 C 30,140 0,110 0,70 C 0,40 20,20 50,20" fill="#4CAF50" />
    <!-- Wing -->
    <path d="M 30,70 C 40,50 60,50 70,70 L 50,110 Z" fill="#81C784" />
    <!-- Head -->
    <circle cx="50" cy="35" r="25" fill="#4CAF50" />
    <!-- Eye -->
    <circle cx="60" cy="30" r="3" fill="#000" />
    <!-- Beak -->
    <path d="M 70,35 C 85,35 85,45 70,45 L 75,40 Z" fill="#FFC107" transform="rotate(20, 70, 35)" />
    <!-- Beak dipping in water -->
    <path d="M 72,43 C 75,55 75,65 72,63" stroke="#FFC107" stroke-width="2" fill="none" />
  </g>

  <!-- Water Bowl -->
  <g transform="translate(10, 160)">
    <rect x="0" y="0" width="180" height="30" rx="5" fill="#2196F3" />
    <rect x="5" y="5" width="170" height="20" fill="#64B5F6" />
  </g>
</svg>
